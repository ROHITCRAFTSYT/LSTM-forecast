[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lstm-forecast"
version = "0.3.0"
description = "Production-grade LSTM time-series forecasting for finance, enhanced with retrieval-augmented forecasting (RAG) and Claude-powered insights."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "lstm-forecast contributors" }]
keywords = [
    "time-series",
    "forecasting",
    "lstm",
    "pytorch",
    "rag",
    "finance",
    "stocks",
    "conformal-prediction",
    "anthropic",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies required for the forecasting library to run.
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "torch>=2.13.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "matplotlib>=3.10.9",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
# Data providers (network access at runtime).
data = ["yfinance>=1.5.2", "pandas-datareader>=0.10.0"]
# Retrieval-augmented forecasting vector index.
rag = ["faiss-cpu>=1.14.3"]
# LLM-powered insights, tuning and chat assistant (default provider: Anthropic/Claude).
ai = ["anthropic>=0.120.0"]
# Additional LLM providers (the AI layer is provider-agnostic).
ai-openai = ["openai>=2.48.0"]          # also covers Ollama + any OpenAI-compatible endpoint
ai-google = ["google-generativeai>=0.8.6"]
ai-all = ["anthropic>=0.120.0", "openai>=2.48.0", "google-generativeai>=0.8.6"]
# REST API service.
api = ["fastapi>=0.140.0", "uvicorn[standard]>=0.51.0", "httpx>=0.28.1"]
# Streamlit dashboard.
dashboard = ["streamlit>=1.60.0", "plotly>=6.9.0"]
# Developer tooling.
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.1",
    "pandas-stubs",
    "types-requests",
]
# Documentation site.
docs = ["mkdocs-material>=9.7.7", "mkdocstrings[python]>=1.0.6"]
# Everything (convenience for local development).
all = [
    "lstm-forecast[data,rag,ai,ai-openai,ai-google,api,dashboard,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ROHITCRAFTSYT/lstm-forecast"
Documentation = "https://github.com/ROHITCRAFTSYT/lstm-forecast#readme"
Repository = "https://github.com/ROHITCRAFTSYT/lstm-forecast"
Issues = "https://github.com/ROHITCRAFTSYT/lstm-forecast/issues"

[project.scripts]
lstm-forecast = "lstm_forecast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lstm_forecast"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"notebooks/*" = ["E402", "F401", "I001"]
# Plotly's API idiomatically uses dict(...) for trace/layout config.
"dashboard/*" = ["C408"]

[tool.mypy]
# No python_version pin: mypy checks against the interpreter running it, so each
# CI matrix job (3.10/3.11/3.12) validates its own version. Pinning to 3.10 made
# mypy parse newer numpy stubs (PEP 695 `type` statements) under 3.10 grammar and
# fail on the 3.12 runner with "Type statement is only supported in Python 3.12".
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "network: tests that require network access (deselect with -m 'not network')",
    "llm: tests that require a live Anthropic API key (deselect with -m 'not llm')",
    "slow: slow tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["lstm_forecast"]
omit = ["*/dashboard/*", "*/api/main.py"]
