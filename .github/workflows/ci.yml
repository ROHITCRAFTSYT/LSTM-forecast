name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"

      - name: Install package
        run: pip install -e ".[dev,api,ai]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy src

      - name: Pytest
        run: pytest -q --cov=lstm_forecast --cov-report=term-missing

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        # Non-blocking: report advisories without failing the build on transitive CVEs.
        run: pip-audit --strict --progress-spinner off || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t lstm-forecast-api .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t lstm-forecast-dashboard .
